<style>
@import url('https://fonts.googleapis.com/css2?family=Allura&family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap');
:root{--ink:#2A201B;--choc:#4A2A1D;--cream:#F7E8CF;--paper:#FFF9F0;--gold:#E5B56B;--coral:#E87863;--line:#dfd5c7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 Inter,Arial,sans-serif}h1,h2,h3,p{margin:0 0 16px}h1,h2,h3{font-family:'DM Serif Display',Georgia,serif;font-weight:400;color:var(--choc)}h1{font-size:48px;line-height:1.08}h2{font-size:30px;line-height:1.2}h3{font-size:22px}button,input,select{font:inherit}button,a,input,select{min-height:44px}button{cursor:pointer;border:0;padding:11px 22px;border-radius:24px;background:var(--cream);color:var(--choc);font-weight:600}button:hover{filter:brightness(.96)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #6F8055;outline-offset:3px}a{color:inherit}small,.muted{color:#736353}.review{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.review strong{margin-right:auto}.review button{padding:8px 14px;border-radius:8px;background:#f3eee6}.review button[aria-pressed=true]{background:var(--choc);color:white}.review small{width:100%;font-size:11px}.wrap{max-width:1280px;margin:auto;padding:32px 24px}.announce{background:var(--choc);color:var(--cream);text-align:center;padding:7px;font-size:11px}.header{display:flex;align-items:center;gap:24px;padding:16px 24px;max-width:1280px;margin:auto}.seal{width:90px;padding:9px}.header nav{display:flex;gap:22px;margin:auto}.header button{background:transparent;padding:8px}.hero{display:grid;grid-template-columns:1fr 1fr;background:var(--cream);align-items:center;min-height:400px;padding:40px max(24px,calc((100vw - 1232px)/2))}.script{font-family:Allura,cursive;color:var(--coral);font-size:1.4em;font-weight:400}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:11px}.primary{background:var(--coral);color:var(--ink)}.dark{background:var(--choc);color:var(--paper)}.art{background:#f2dfbc;border-radius:12px;min-height:160px;display:grid;place-items:center;position:relative;overflow:hidden}.art img{width:70%;max-height:300px;object-fit:contain}.art small{position:absolute;bottom:8px;background:var(--paper);padding:2px 7px;font-size:10px}.hero .art{min-height:320px;background:transparent}.values{margin-top:24px;display:flex;gap:20px;font-size:11px}.sectionhead{display:flex;justify-content:space-between;align-items:center}.merch{display:grid;grid-template-columns:3fr 1fr;gap:24px}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.product{text-align:center}.product .art{aspect-ratio:1;min-height:0}.product h3{font-size:17px;margin:12px 0 0}.product p{margin:4px 0 10px}.product button{width:100%;font-size:11px}.monthly{background:#f8e4d8;padding:20px;border-radius:12px}.story{display:grid;grid-template-columns:1fr 1fr 1fr;gap:32px;align-items:center}.blank{min-height:250px;border:1px dashed #b2a58e;display:grid;place-items:center;background:#eee7d9;color:#736353;text-align:center;padding:32px}.quote{background:#f6eee3;padding:32px;border-radius:28px;font:21px/1.4 'DM Serif Display',serif}.gallery{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.gallery .art{min-height:100px}.closing{background:var(--choc);color:var(--paper);display:flex;align-items:center;justify-content:space-around;padding:32px}.closing h2{color:inherit;margin:0}footer{display:grid;grid-template-columns:1fr 1fr 1fr 2fr;gap:32px}label{display:block;font-size:12px;font-weight:600;margin-bottom:14px}input,select{display:block;width:100%;padding:10px;border:1px solid #cbbfae;border-radius:8px;background:white;color:var(--ink);margin-top:5px}input[type=checkbox],input[type=radio]{width:auto;min-height:20px;display:inline;vertical-align:middle;margin-right:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:40px}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:24px}.summary{background:var(--cream);border-radius:12px;padding:24px;align-self:start}.row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}.notice{background:#f9edce;padding:12px;border-radius:8px;font-size:12px;margin-bottom:20px}.admin{background:#f5f6f8;min-height:800px;display:grid;grid-template-columns:210px 1fr}.sidebar{background:white;border-right:1px solid #ddd;padding:24px}.sidebar button{display:block;width:100%;text-align:left;border-radius:8px;margin:6px 0;background:transparent}.sidebar button.active{background:#f7e8cf}.workspace{padding:32px;min-width:0}.admin h1,.admin h2,.admin h3{font-family:Inter,sans-serif}.admin h1{font-size:26px}.toolbar{display:flex;gap:12px;align-items:center;margin:20px 0}.toolbar input{margin:0;max-width:350px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:16px;border-bottom:1px solid #e9e9e9;white-space:nowrap}th{font-size:11px;text-transform:uppercase;color:#70695e}.badge{background:#edf3e8;color:#365329;border-radius:12px;padding:4px 10px;font-size:11px}.admin button{border-radius:8px}dialog{border:1px solid var(--line);border-radius:16px;max-width:520px;width:calc(100% - 32px);padding:28px;color:var(--ink)}dialog::backdrop{background:#22180e70}.dialoghead{display:flex;justify-content:space-between;align-items:start}.dialoghead button{background:transparent;padding:4px 12px}.mobilemenu{display:none}.reference{max-width:715px;display:block;width:100%;margin:auto}.status{min-height:24px;color:#365329}.hidden{display:none!important}@media(max-width:767px){h1{font-size:40px;line-height:44px}.review{position:relative;padding:10px}.review strong{width:100%}.review button{font-size:12px;padding:8px}.header{padding:6px 16px;gap:8px;justify-content:space-between}.header nav{display:none}.mobilemenu{display:block!important}.seal{width:90px}.hero{grid-template-columns:1fr;padding:24px 16px}.hero .art{min-height:220px;grid-row:2}.hero .art img{height:210px;width:auto}.wrap{padding:28px 16px}.merch,.story,.two{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,1fr)}.gallery{display:flex;overflow:auto}.gallery .art{min-width:130px}.closing{display:block;text-align:center}.closing button{margin-top:20px}footer{grid-template-columns:1fr 1fr}footer>div:last-child{grid-column:1/-1}.admin{grid-template-columns:1fr}.sidebar{display:flex;gap:8px;overflow:auto;padding:8px}.sidebar strong{display:none}.sidebar button{width:auto;white-space:nowrap}.workspace{padding:20px 16px}.toolbar{flex-wrap:wrap}.values{gap:12px}.review small{line-height:1.4}}
dialog.drawer{margin:0 0 0 auto;min-height:100dvh;max-height:100dvh;overflow:auto;border-radius:0;width:480px;max-width:100%}.two>.art{aspect-ratio:4/5}.header .seal{position:relative;margin-top:-26px;background:var(--paper);border-radius:50%}@media(max-width:767px){dialog.drawer{width:100%}.header .seal{margin-top:0}}
.photo img{width:100%;height:100%;max-height:none;object-fit:cover}.photo{aspect-ratio:1}.story>.photo{aspect-ratio:4/5}.hero{background:var(--cream) url('../brand/generated-v1/hero.png') center/cover no-repeat;min-height:430px}.hero>div:first-child{position:relative;z-index:1}.hero-photo{height:320px}.closing{background:linear-gradient(90deg,#4a2a1df2,#4a2a1dbd),url('../brand/generated-v1/hero.png') center/cover}.gallery .photo{min-height:0}.gallery .photo img{display:block}@media(max-width:767px){.hero{background:var(--cream);padding-bottom:0}.hero-photo{height:240px;margin:20px -16px 0;background:url('../brand/generated-v1/hero.png') 85% center/auto 100% no-repeat}.gallery .photo{height:130px}.hero>div:first-child{background:var(--cream)}}
.hero>*,.story>*,.merch>*,.products>*,.two>*,footer>*{min-width:0}.photo img{min-width:0;max-width:100%}.review{overflow-wrap:anywhere}
</style>
<div class="review"><strong>Cookies & Chips <small style="display:inline">/ Visual review 01</small></strong><button data-page="home" aria-pressed="true">Home</button><button data-page="product">Product</button><button data-page="checkout">Checkout</button><button data-page="admin">Admin</button><button data-page="reference">Reference</button><small>DESIGN REVIEW · Temporary AI-generated photography · Sample prices and content · No orders, emails, payments or account changes · Resize the browser to review mobile</small></div><main id="app"></main><dialog id="modal"></dialog>
<script>
const logo='../brand/cookies-and-chips-logo.png',icon='../brand/logo-package/masters/cookie-icon.png';
const names=['Ali’s Classic','The Cozy Oat','Crinkle Crush','Macadamia Dream'];let cart=0,page='home',selected=new Set(),bases=names.map(()=>20),prices=names.map(()=>20),social={handle:'',url:'',visible:true};
const photos=['classic','oat','crinkle','macadamia']; const photo=(name,alt)=>`<div class="art photo"><img src="../brand/generated-v1/${name}.png" alt="${alt}"></div>`;
const $=s=>document.querySelector(s);const art=(label='Product photo pending')=>`<div class="art"><img src="${icon}" alt=""><small>${label}</small></div>`;
const header=()=>`<div class="announce">♥ Good cookies make a brighter day. &nbsp; Baked with love in Arizona.</div><header class="header"><button class="mobilemenu" onclick="menu()">☰ Menu</button><img class="seal" src="${logo}" alt="Cookies & Chips"><nav><button onclick="go('home')">Home</button><button onclick="go('product')">Shop</button><button onclick="go('product')">Cookie of the Month</button><button onclick="document.getElementById('story')?.scrollIntoView()">My Story</button></nav><button onclick="showCart()">Bag (${cart})</button></header>`;
const productcards=()=>names.map((n,i)=>`<article class="product">${photo(photos[i],n+' — generated illustration')}<h3>${n}</h3><p>$${prices[i].toFixed(2)} / dozen</p><button onclick="go('product')">VIEW COOKIE →</button></article>`).join('');
function go(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.page===p));render();window.scrollTo(0,0)}
function render(){let html='';if(page==='home')html=header()+`<section class="hero"><div><h1>Cookies make<br>life <span class="script">better.</span></h1><p class="eyebrow">Even if it’s only for a minute.</p><button class="primary" onclick="go('product')">SHOP COOKIES →</button><div class="values"><span>♧ Freshly<br>baked</span><span>♡ High quality<br>ingredients</span><span>⌂ Small batch<br>made with love</span></div></div><div class="hero-photo" role="img" aria-label="Generated chocolate chip cookie stack"></div></section><section class="wrap merch"><div><div class="sectionhead"><h2>Our Best Sellers</h2><button onclick="go('product')">SHOP ALL →</button></div>${'<div class="products">'+productcards()+'</div>'}<small>Featured assortment is provisional.</small></div><aside class="monthly"><h3>♡ Cookie of the Month</h3>${photo('pumpkin','Generated pumpkin chocolate chip cookies')}<h3>Pumpkin Patch</h3><p>Proposed seasonal feature · $20 / dozen</p><button class="dark" onclick="go('product')">EXPLORE COOKIES →</button></aside></section><section class="wrap story" id="story">${photo('story','Generated anonymous baking scene; not a portrait of Heather')}<div><h2>My Story</h2><h3 class="script">Hi, I’m Heather.</h3><p>A little introduction to the person behind your cookies.</p><p class="muted">Final founder story goes here. This copy is a layout placeholder.</p></div><div class="quote">“A little space for a very happy cookie customer.”<p><small>Sample review layout, not a real testimonial</small></p><span style="color:#C99155">★★★★★</span></div></section><section class="wrap"><h2>Follow Along</h2><p class="eyebrow">Baking, behind the scenes, and a little everyday joy.</p><div class="gallery">${['classic','story','oat','crinkle','macadamia','pumpkin'].map(n=>photo(n,'Generated bakery inspiration')).join('')}</div></section><section class="closing"><div class="script">Life’s short.</div><h2>Eat the damn cookie.</h2><button onclick="go('product')">SHOP COOKIES →</button></section><footer class="wrap"><img class="seal" src="${logo}" alt=""><div><strong>Shop</strong><p>All cookies<br>Seasonal<br>For the pups</p></div><div><strong>Support</strong><p>Shipping & pickup<br>FAQ · Contact<br>Privacy · Terms</p></div><div><h3>Join our cookie club</h3><p>Fresh news from the kitchen.</p><label>Email address<input type="email" placeholder="you@example.com"></label><button class="primary" onclick="info('Email signup is a design preview. Nothing was submitted.')">JOIN →</button></div></footer>`;
if(page==='product')html=header()+`<div class="wrap"><p class="eyebrow">Shop / Cookies / Ali’s Classic</p><div class="two">${photo('classic','Generated chocolate chip cookies')}<div><p class="eyebrow">The original favorite</p><h1>Ali’s Classic</h1><h3>$${prices[0].toFixed(2)} <small>/ dozen</small></h3><p>A soft, buttery chocolate chip cookie filled with melted semi sweet chocolate and a golden-browned base.</p><div class="notice">One package contains 12 cookies. Placeholder price for review.</div><label>Dozens<select id="qty"><option value="1">1 dozen · 12 cookies</option><option value="2">2 dozen · 24 cookies</option><option value="3">3 dozen · 36 cookies</option></select></label><button class="dark" onclick="cart+=Number($('#qty').value);showCart()">ADD TO BAG →</button><p style="margin-top:24px">Free pickup · Local delivery eligibility at checkout</p><details><summary>Ingredients & allergens</summary><p>Verified ingredient and allergen information must be supplied before launch.</p></details><details><summary>Freshness & fulfillment</summary><p>Provisional preparation time: 48 hours. Pickup by appointment. Shipping coming soon.</p></details></div></div></div>`;
if(page==='checkout')html=header()+`<div class="wrap"><p class="eyebrow">Bag → Checkout → Confirmation</p><h1>A little joy, on its way.</h1><div class="notice">Checkout preview only. Do not enter real personal information. No payment will be taken.</div><div class="two"><form onsubmit="event.preventDefault();info('Preview complete. Production checkout will calculate tax, confirm the total, and then open PayPal.')"><h2>1. Your details</h2><p>Continue as a guest. An account is optional.</p><button type="button" onclick="info('Account sign-in is planned. Guest checkout remains available.')">Sign in to your account</button><label>Email<input type="email" placeholder="sample@example.com" required></label><label>Name<input placeholder="Sample customer" required></label><h2>2. How would you like them?</h2><label>Fulfillment<select id="fulfill" onchange="fulfillment()"><option value="pickup">Free pickup · by appointment</option><option value="delivery">Local delivery · eligibility pending</option><option disabled>Shipping · coming soon</option></select></label><div id="address" class="hidden"><label>Street address<input placeholder="Sample street address"></label><label>City<input placeholder="City"></label><div class="two"><label>State<input placeholder="AZ"></label><label>ZIP code<input placeholder="ZIP"></label></div></div><p id="fulfillment-note">Pickup location and appointment are confirmed before a live order.</p><h2>3. Review & pay</h2><p>Taxes and any delivery charge must be confirmed before payment.</p><button class="dark" type="submit">PREVIEW PAYMENT STEP →</button></form><aside class="summary"><h2>Your bag</h2><div class="row"><span>Ali’s Classic<br>${Math.max(cart,1)} dozen · ${Math.max(cart,1)*12} cookies</span><strong>$${(Math.max(cart,1)*prices[0]).toFixed(2)}</strong></div><div class="row"><span>Fulfillment</span><span id="fee">Free pickup</span></div><div class="row"><span>Tax</span><span>Calculated before payment</span></div><div class="row"><strong>Merchandise subtotal</strong><strong>$${(Math.max(cart,1)*prices[0]).toFixed(2)}</strong></div><p>Final total awaits tax and fulfillment confirmation.</p></aside></div></div>`;
if(page==='admin')html=`<div class="admin"><aside class="sidebar"><strong>COOKIES & CHIPS<br><small>Management</small></strong><button class="active" onclick="go('admin')">Products</button><button onclick="info('Orders page will follow this same light enterprise layout.')">Orders</button><button onclick="info('Categories, subcategories and collections will be editable data.')">Catalog</button><button onclick="socialEditor()">Social profiles</button><button onclick="info('Fulfillment settings will include shipping availability, delivery rules and pickup details.')">Fulfillment</button></aside><section class="workspace"><p class="eyebrow">Catalog management</p><div class="sectionhead"><div><h1>Products</h1><p class="muted">Manage your menu and selling prices.</p></div><span class="badge">Design preview</span></div><div class="toolbar"><input aria-label="Search products" placeholder="Search products…" oninput="filterRows(this.value)"><button onclick="bulk()" class="dark">Edit selected prices</button><span id="count">${selected.size} selected</span></div><div class="panel tablewrap"><table><thead><tr><th>Select</th><th>Product</th><th>Package</th><th>Base</th><th>Selling price</th><th>Status</th></tr></thead><tbody>${names.map((n,i)=>`<tr data-name="${n.toLowerCase()}"><td><input aria-label="Select ${n}" type="checkbox" ${selected.has(i)?'checked':''} onchange="selectProduct(${i},this.checked)"></td><td><strong>${n}</strong></td><td>12 cookies</td><td>$${bases[i].toFixed(2)}</td><td>$${prices[i].toFixed(2)}</td><td><span class="badge">Sample</span></td></tr>`).join('')}</tbody></table></div><p class="muted">Select explicit products, preview the markup, then apply. These changes live only in this browser session.</p><p role="status" id="saved" class="status"></p></section></div>`;
if(page==='reference')html=`<div class="wrap"><h1>The approved direction</h1><p>Your supplied rendition governs the overall composition. The clickable review uses temporary generated photography until original photography is available.</p><img class="reference" src="../brand/homepage-production-reference-2026-09-19.png" alt="Supplied Cookies and Chips homepage production reference"></div>`;$('#app').innerHTML=html;}
function openDialog(title,body){$('#modal').className=page==='admin'?'drawer':'';$('#modal').innerHTML=`<div class="dialoghead"><h2>${title}</h2><button aria-label="Close dialog" onclick="$('#modal').close()">✕</button></div>${body}`;$('#modal').showModal()}
function info(s){openDialog('Design preview',`<p>${s}</p>`)}function menu(){openDialog('Explore',`<button onclick="$('#modal').close();go('product')">Shop cookies</button><button onclick="$('#modal').close();go('checkout')">Account / checkout</button><p>Search and remaining content pages follow in the next specification pass.</p>`)}
function showCart(){openDialog('Your bag',cart?`<p>Ali’s Classic · ${cart} dozen (${cart*12} cookies)</p><h3>$${(cart*prices[0]).toFixed(2)}</h3><p>Tax and fulfillment calculated before payment.</p><button class="dark" onclick="$('#modal').close();go('checkout')">CHECKOUT →</button> <button onclick="cart=0;$('#modal').close();render()">Remove</button>`:`<p>Your bag is empty.</p><button onclick="$('#modal').close();go('product')">Explore cookies</button>`)}
function fulfillment(){let d=$('#fulfill').value==='delivery';$('#address').classList.toggle('hidden',!d);$('#address').querySelectorAll('input').forEach(i=>i.required=d);$('#fee').textContent=d?'Eligibility pending':'Free pickup';$('#fulfillment-note').textContent=d?'Provisional: free within 10 miles; free within 50 miles on $50+ orders, otherwise $10. Actual eligibility needs the dispatch address.':'Pickup location and appointment are confirmed before a live order.'}
function selectProduct(i,on){on?selected.add(i):selected.delete(i);$('#count').textContent=selected.size+' selected'}function filterRows(q){document.querySelectorAll('tr[data-name]').forEach(r=>r.hidden=!r.dataset.name.includes(q.toLowerCase()))}
function bulk(){if(!selected.size)return info('Select at least one product first.');openDialog('Update selected prices',`<p>${selected.size} products selected. Edit the base for each selected product.</p><div id="bases">${Array.from(selected).map(i=>`<label>${names[i]} · base per dozen<input type="number" min="0" step="0.01" data-base="${i}" value="${bases[i]}" oninput="previewPrice()"></label>`).join('')}</div><label>Markup type<select id="mode" onchange="previewPrice()"><option value="percent">Percentage</option><option value="fixed">Fixed dollar amount</option></select></label><label>Markup<input id="markup" type="number" value="0" min="0" step="0.01" oninput="previewPrice()"></label><div class="summary" id="price-preview"></div><p>Markup applies to each product’s base, not its previous selling price.</p><button class="dark" id="apply" onclick="applyPrice()">Apply to selected products</button>`);previewPrice()}
function previewPrice(){const v=Number($('#markup').value),valid=$('#markup').value!==''&&Number.isFinite(v)&&v>=0&&Array.from(document.querySelectorAll('[data-base]')).every(i=>i.value!==''&&Number.isFinite(Number(i.value))&&Number(i.value)>=0);$('#apply').disabled=!valid;$('#price-preview').textContent=valid?Array.from(selected).map(i=>names[i]+': $'+prices[i].toFixed(2)+' → $'+(Number(Array.from(document.querySelectorAll('[data-base]')).find(el=>Number(el.dataset.base)===i).value)*(1+($('#mode').value==='percent'?v/100:0))+($('#mode').value==='fixed'?v:0)).toFixed(2)).join(' · '):'Enter a valid nonnegative markup.'}
function applyPrice(){let v=Number($('#markup').value);selected.forEach(i=>{bases[i]=Number(Array.from(document.querySelectorAll('[data-base]')).find(el=>Number(el.dataset.base)===i).value);prices[i]=Math.round((Number(Array.from(document.querySelectorAll('[data-base]')).find(el=>Number(el.dataset.base)===i).value)*(1+($('#mode').value==='percent'?v/100:0))+($('#mode').value==='fixed'?v:0))*100)/100});$('#modal').close();render();$('#saved').textContent='Sample prices updated. No live products changed.'}
function socialEditor(){openDialog('Social profile',`<p>Example: Instagram. Production supports multiple platforms and ordering.</p><form id="socialform"><label>Handle<input id="handle" placeholder="@yourhandle"></label><label>Profile URL<input id="url" type="url" placeholder="https://www.instagram.com/yourhandle" required></label><label><input id="visible" type="checkbox">Visible on storefront</label><p id="socialerror" role="alert"></p><button class="dark">Save preview</button></form>`);$('#handle').value=social.handle;$('#url').value=social.url;$('#visible').checked=social.visible;$('#socialform').onsubmit=e=>{e.preventDefault();let u;try{u=new URL($('#url').value)}catch{}if(!u||u.protocol!=='https:'||u.username||u.password){$('#socialerror').textContent='Enter an HTTPS profile URL without embedded credentials.';return}social={handle:$('#handle').value,url:u.href,visible:$('#visible').checked};$('#modal').close();$('#saved').textContent='Social profile saved in this preview session.'}}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));render();
</script></html>
