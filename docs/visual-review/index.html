<div class="review"><strong>Cookies & Chips <small style="display:inline">/ Visual review 01</small></strong><button data-page="home" aria-pressed="true">Home</button><button data-page="shop">Shop</button><button data-page="product">Product</button><button data-page="checkout">Checkout</button><button data-page="admin">Admin</button><button data-page="reference">Reference</button><small>DESIGN REVIEW · Temporary AI-generated photography · Sample prices and content · No orders, emails, payments or account changes · Resize the browser to review mobile</small></div><main id="app"></main><dialog id="modal"></dialog>
<script>
const logo='../brand/cookies-and-chips-logo.png',icon='../brand/logo-package/masters/cookie-icon.png';
const names=['Ali’s Classic','The Cozy Oat','Crinkle Crush','Macadamia Dream'];let shopState={},activeProduct=0,bag={},cart=0,page='home',selected=new Set(),bases=names.map(()=>20),prices=names.map(()=>20),social={handle:'',url:'',visible:true};
const photos=['classic','oat','crinkle','macadamia']; const photo=(name,alt)=>`<div class="art photo"><img src="../brand/generated-v1/${name}.png" alt="${alt}"></div>`;
const catalog=[
{name:'Ali’s Classic',image:'classic',category:'Cookies',collection:'Everyday',flavor:'Chocolate',description:'A soft, buttery chocolate chip cookie filled with melted semi sweet chocolate and a golden-browned base.'},
{name:'The Cozy Oat',image:'oat',category:'Cookies',collection:'Everyday',flavor:'Oatmeal',description:'A soft, cinnamon-kissed oatmeal cookie with sweet raisins.'},
{name:'Crinkle Crush',image:'crinkle',category:'Cookies',collection:'Everyday',flavor:'Chocolate',description:'A rich, brownie-like chocolate cookie with a delicate powdered sugar crackle and fudgy center.'},
{name:'Macadamia Dream',image:'macadamia',category:'Cookies',collection:'Everyday',flavor:'White chocolate & nuts',description:'A soft, buttery cookie filled with creamy white chocolate and crunchy macadamia nuts.'},
{name:'Cinnamon Kiss',image:null,category:'Cookies',collection:'Everyday',flavor:'Cinnamon',description:'A soft, buttery snickerdoodle rolled in cinnamon sugar and baked with a tender, chewy center.'},
{name:'Pumpkin Patch',image:'pumpkin',category:'Cookies',collection:'Seasonal',flavor:'Pumpkin & chocolate',description:'A soft pumpkin cookie with warm autumn spice and generous pockets of semi sweet chocolate chips.'},
{name:'Sandie’s Treats',image:null,category:'For the pups',collection:'Everyday',flavor:'Pumpkin & peanut butter',description:'Homemade pumpkin + peanut butter dog treats made with simple, natural ingredients.',price:8,unit:'10 treats'}];
const unit=i=>catalog[i].unit||'dozen', price=i=>prices[i]??catalog[i].price??20;
const total=()=>Object.entries(bag).reduce((sum,[i,q])=>sum+price(Number(i))*q,0);
const bagLines=()=>Object.entries(bag).map(([i,q])=>`<div class="row"><span>${catalog[i].name}<br>${q} × ${unit(i)}</span><strong>$${(price(Number(i))*q).toFixed(2)}</strong></div>`).join('');
function openProduct(i){activeProduct=i;go('product')}
function addProduct(){bag[activeProduct]=(bag[activeProduct]||0)+Number($('#qty').value);cart=Object.values(bag).reduce((a,b)=>a+b,0);showCart()}
function shopResults(){['shop-search','category','collection','flavor','sort'].forEach(id=>shopState[id]=$('#'+id).value);const q=$('#shop-search').value.toLowerCase(),c=$('#category').value,k=$('#collection').value,f=$('#flavor').value;let found=catalog.map((p,i)=>({...p,i})).filter(p=>(!q||(p.name+' '+p.description).toLowerCase().includes(q))&&(!c||p.category===c)&&(!k||p.collection===k)&&(!f||p.flavor===f));if($('#sort').value==='price')found.sort((a,b)=>price(a.i)-price(b.i));if($('#sort').value==='name')found.sort((a,b)=>a.name.localeCompare(b.name));$('#result-count').textContent=found.length+(found.length===1?' product':' products');$('#shop-grid').innerHTML=found.length?found.map(p=>`<article class="product">${p.image?photo(p.image,p.name+' — generated illustration'):'<div class="blank">Image coming soon</div>'}<h3>${p.name}</h3><p>$${price(p.i).toFixed(2)} / ${unit(p.i)}</p><button onclick="openProduct(${p.i})">VIEW COOKIE →</button></article>`).join(''):'<div class="panel"><h3>No cookies match just yet.</h3><p>Try a different search or clear your filters.</p><button onclick="clearShop()">Clear filters</button></div>'}
function clearShop(){['shop-search','category','collection','flavor'].forEach(id=>$('#'+id).value='');$('#sort').value='featured';shopResults()}
function checkoutTab(mode){const guest=mode==='guest';$('#guest-tab').setAttribute('aria-selected',guest);$('#login-tab').setAttribute('aria-selected',!guest);$('#guest-panel').hidden=!guest;$('#login-panel').hidden=guest;$('#guest-panel').querySelectorAll('input').forEach(i=>i.disabled=!guest);$('#login-panel').querySelectorAll('input').forEach(i=>i.disabled=guest);$('#payment-preview').disabled=!guest;}
const $=s=>document.querySelector(s);const art=(label='Product photo pending')=>`<div class="art"><img src="${icon}" alt=""><small>${label}</small></div>`;
const header=()=>`<div class="announce">♥ Good cookies make a brighter day. &nbsp; Baked with love in Arizona.</div><header class="header"><button class="mobilemenu" onclick="menu()">☰ Menu</button><img class="seal" src="${logo}" alt="Cookies & Chips"><nav><button onclick="go('home')">Home</button><button onclick="go('shop')">Shop</button><button onclick="openProduct(5)">Cookie of the Month</button><button onclick="document.getElementById('story')?.scrollIntoView()">My Story</button></nav><button onclick="showCart()">Bag (${cart})</button></header>`;
const productcards=()=>names.map((n,i)=>`<article class="product">${photo(photos[i],n+' — generated illustration')}<h3>${n}</h3><p>$${prices[i].toFixed(2)} / dozen</p><button onclick="openProduct(${i})">VIEW COOKIE →</button></article>`).join('');
function go(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.page===p));render();window.scrollTo(0,0)}
function render(){let html='';if(page==='home')html=header()+`<section class="hero"><div><h1>Cookies make<br>life <span class="script">better.</span></h1><p class="eyebrow">Even if it’s only for a minute.</p><button class="primary" onclick="go('shop')">SHOP COOKIES →</button><div class="values"><span>♧ Freshly<br>baked</span><span>♡ High quality<br>ingredients</span><span>⌂ Small batch<br>made with love</span></div></div><div class="hero-photo" role="img" aria-label="Generated chocolate chip cookie stack"></div></section><section class="wrap merch"><div><div class="sectionhead"><h2>Our Best Sellers</h2><button onclick="go('shop')">SHOP ALL →</button></div>${'<div class="products">'+productcards()+'</div>'}<small>Featured assortment is provisional.</small></div><aside class="monthly"><h3>♡ Cookie of the Month</h3>${photo('pumpkin','Generated pumpkin chocolate chip cookies')}<h3>Pumpkin Patch</h3><p>Proposed seasonal feature · $20 / dozen</p><button class="dark" onclick="openProduct(5)">EXPLORE COOKIES →</button></aside></section><section class="wrap story" id="story">${photo('story','Generated anonymous baking scene; not a portrait of Heather')}<div><h2>My Story</h2><h3 class="script">Hi, I’m Heather.</h3><p>A little introduction to the person behind your cookies.</p><p class="muted">Final founder story goes here. This copy is a layout placeholder.</p></div><div class="quote">“A little space for a very happy cookie customer.”<p><small>Sample review layout, not a real testimonial</small></p><span style="color:#C99155">★★★★★</span></div></section><section class="wrap"><h2>Follow Along</h2>${socialLinks()}<p class="eyebrow">Baking, behind the scenes, and a little everyday joy.</p><div class="gallery">${['classic','story','oat','crinkle','macadamia','pumpkin'].map(n=>photo(n,'Generated bakery inspiration')).join('')}</div></section><section class="closing"><div class="script">Life’s short.</div><h2>Eat the damn cookie.</h2><button onclick="go('shop')">SHOP COOKIES →</button></section><footer class="wrap"><img class="seal" src="${logo}" alt=""><div><strong>Shop</strong><p>All cookies<br>Seasonal<br>For the pups</p></div><div><strong>Support</strong><p>Shipping & pickup<br>FAQ · Contact<br>Privacy · Terms</p></div><div><h3>Join our cookie club</h3><p>Fresh news from the kitchen.</p><label>Email address<input type="email" placeholder="you@example.com"></label><button class="primary" onclick="info('Email signup is a design preview. Nothing was submitted.')">JOIN →</button>${socialLinks()}</div></footer>`;
if(page==='product')html=header()+`<div class="wrap"><p class="eyebrow">Shop / Cookies / ${catalog[activeProduct].name}</p><div class="two">${catalog[activeProduct].image?photo(catalog[activeProduct].image,'Generated '+catalog[activeProduct].name):'<div class="blank">Image coming soon</div>'}<div><p class="eyebrow">${catalog[activeProduct].collection}</p><h1>${catalog[activeProduct].name}</h1><h3>$${price(activeProduct).toFixed(2)} <small>/ ${unit(activeProduct)}</small></h3><p>${catalog[activeProduct].description}</p><div class="notice">One package contains ${activeProduct===6?10:12} ${activeProduct===6?'treats':'cookies'}. Placeholder price for review.</div><label>Packages<select id="qty"><option value="1">1 package · ${unit(activeProduct)}</option><option value="2">2 packages</option><option value="3">3 packages</option></select></label><button class="dark" onclick="addProduct()">ADD TO BAG →</button><p style="margin-top:24px">Free pickup · Local delivery eligibility at checkout</p><details><summary>Nutrition information</summary><p>Recipe-based nutrition will appear here after ingredient matching, serving-size calculation and owner review. No nutrition values have been calculated for this preview.</p></details><details><summary>Ingredients & allergens</summary><p>Verified ingredient and allergen information must be supplied before launch.</p></details><details><summary>Freshness & fulfillment</summary><p>Provisional preparation time: 48 hours. Pickup by appointment. Shipping coming soon.</p></details></div></div></div>`;
if(page==='shop')html=header()+`<section class="wrap"><p class="eyebrow">A little something for every craving</p><h1>Find your favorite.</h1><p>Freshly baked favorites, seasonal treats, and a little joy for the pups.</p><div class="shopfilters"><label>Search<input id="shop-search" placeholder="Chocolate, oatmeal, pumpkin…" oninput="shopResults()"></label>${[['category','Category'],['collection','Collection'],['flavor','Flavor']].map(([key,label])=>`<label>${label}<select id="${key}" onchange="shopResults()"><option value="">All ${key==='category'?'categories':label.toLowerCase()+'s'}</option>${[...new Set(catalog.map(p=>p[key]))].map(v=>`<option>${v}</option>`).join('')}</select></label>`).join('')}<label>Sort<select id="sort" onchange="shopResults()"><option value="featured">Featured</option><option value="price">Price: low to high</option><option value="name">Name A–Z</option></select></label></div><div class="sectionhead"><p role="status" id="result-count"></p><button onclick="clearShop()">Clear filters</button></div><div id="shop-grid" class="products"></div></section>`;
if(page==='checkout')html=header()+`<div class="wrap"><p class="eyebrow">Bag → Checkout → Confirmation</p><h1>A little joy, on its way.</h1><div class="notice">Checkout preview only. Do not enter real personal information. No payment will be taken.</div><div class="two"><form onsubmit="event.preventDefault();info('Preview complete. Production checkout will calculate tax, confirm the total, and then open PayPal.')"><h2>1. Your details</h2><div class="checkout-tabs" role="tablist" aria-label="Checkout identity"><button id="guest-tab" role="tab" aria-selected="true" aria-controls="guest-panel" type="button" onclick="checkoutTab('guest')">Guest</button><button id="login-tab" role="tab" aria-selected="false" aria-controls="login-panel" type="button" onclick="checkoutTab('login')">Login</button></div><section id="guest-panel" role="tabpanel" aria-labelledby="guest-tab"><p>No password needed to place your order.</p><label>Email<input type="email" placeholder="sample@example.com" required></label><label>Name<input placeholder="Sample customer" required></label><label><input type="checkbox" checked>Create an account after my order</label><p class="muted">We’ll email a secure link to finish setting up your account. Uncheck to stay a guest. This does not subscribe you to marketing emails.</p></section><section id="login-panel" role="tabpanel" aria-labelledby="login-tab" hidden><p>Welcome back. Sign in to use your saved details and see your orders.</p><label>Email<input type="email" placeholder="sample@example.com" disabled></label><label>Password<input type="password" placeholder="Password" disabled></label><button type="button" class="dark" onclick="info('Sign-in is a preview only. Return to Guest to explore checkout.')">LOGIN</button><button type="button" onclick="info('Password reset will send a secure email in the live application.')">Forgot password?</button></section><h2>2. How would you like them?</h2><label>Fulfillment<select id="fulfill" onchange="fulfillment()"><option value="pickup">Free pickup · by appointment</option><option value="delivery">Local delivery · eligibility pending</option><option disabled>Shipping · coming soon</option></select></label><div id="address" class="hidden"><label>Street address<input placeholder="Sample street address"></label><label>City<input placeholder="City"></label><div class="two"><label>State<input placeholder="AZ"></label><label>ZIP code<input placeholder="ZIP"></label></div></div><p id="fulfillment-note">Pickup location and appointment are confirmed before a live order.</p><h2>3. Review & pay</h2><p>Taxes and any delivery charge must be confirmed before payment.</p><button id="payment-preview" class="dark" type="submit">PREVIEW PAYMENT STEP →</button></form><aside class="summary"><h2>Your bag</h2>${cart?bagLines():'<p>Your bag is empty. Add a cookie from the Shop.</p>'}<div class="row"><span>Fulfillment</span><span id="fee">Free pickup</span></div><div class="row"><span>Tax</span><span>Calculated before payment</span></div><div class="row"><strong>Merchandise subtotal</strong><strong>$${total().toFixed(2)}</strong></div><p>Final total awaits tax and fulfillment confirmation.</p></aside></div></div>`;
if(page==='admin')html=`<div class="admin"><aside class="sidebar"><strong>COOKIES & CHIPS<br><small>Management</small></strong><button class="active" onclick="go('admin')">Products</button><button onclick="info('Orders page will follow this same light enterprise layout.')">Orders</button><button onclick="info('Categories, subcategories and collections will be editable data.')">Catalog</button><button onclick="recipeEditor()">Recipe & product</button><button onclick="socialEditor()">Social profiles</button><button onclick="info('Fulfillment settings will include shipping availability, delivery rules and pickup details.')">Fulfillment</button></aside><section class="workspace"><p class="eyebrow">Catalog management</p><div class="sectionhead"><div><h1>Products</h1><p class="muted">Manage your menu and selling prices.</p></div><span class="badge">Design preview</span></div><div class="toolbar"><input aria-label="Search products" placeholder="Search products…" oninput="filterRows(this.value)"><button onclick="bulk()" class="dark">Edit selected prices</button><span id="count">${selected.size} selected</span></div><div class="panel tablewrap"><table><thead><tr><th>Select</th><th>Product</th><th>Package</th><th>Base</th><th>Selling price</th><th>Status</th></tr></thead><tbody>${names.map((n,i)=>`<tr data-name="${n.toLowerCase()}"><td><input aria-label="Select ${n}" type="checkbox" ${selected.has(i)?'checked':''} onchange="selectProduct(${i},this.checked)"></td><td><strong>${n}</strong></td><td>12 cookies</td><td>$${bases[i].toFixed(2)}</td><td>$${prices[i].toFixed(2)}</td><td><span class="badge">Sample</span></td></tr>`).join('')}</tbody></table></div><p class="muted">Select explicit products, preview the markup, then apply. These changes live only in this browser session.</p><p role="status" id="saved" class="status"></p></section></div>`;
if(page==='reference')html=`<div class="wrap"><h1>The approved direction</h1><p>Your supplied rendition governs the overall composition. The clickable review uses temporary generated photography until original photography is available.</p><img class="reference" src="../brand/homepage-production-reference-2026-09-19.png" alt="Supplied Cookies and Chips homepage production reference"></div>`;if(['shop','product','checkout'].includes(page))html+=`<footer class="wrap"><div><strong>Follow Cookies & Chips</strong>${socialLinks()}</div></footer>`;$('#app').innerHTML=html;if(page==='shop'){Object.entries(shopState).forEach(([id,value])=>$('#'+id).value=value);shopResults();}}
function openDialog(title,body){$('#modal').className=page==='admin'?'drawer':'';$('#modal').innerHTML=`<div class="dialoghead"><h2>${title}</h2><button aria-label="Close dialog" onclick="$('#modal').close()">✕</button></div>${body}`;$('#modal').showModal()}
function info(s){openDialog('Design preview',`<p>${s}</p>`)}function menu(){openDialog('Explore',`<button onclick="$('#modal').close();go('shop')">Shop cookies</button><button onclick="$('#modal').close();go('checkout')">Account / checkout</button><p>Search and remaining content pages follow in the next specification pass.</p>`)}
function showCart(){openDialog('Your bag',cart?`${bagLines()}<h3>Subtotal $${total().toFixed(2)}</h3><p>Tax and fulfillment calculated before payment.</p><button class="dark" onclick="$('#modal').close();go('checkout')">CHECKOUT →</button> <button onclick="$('#modal').close();go('shop')">CONTINUE SHOPPING</button><button onclick="cart=0;bag={};$('#modal').close();render()">Empty bag</button>`:`<p>Your bag is empty.</p><button onclick="$('#modal').close();go('shop')">CONTINUE SHOPPING</button>`)}
function fulfillment(){let d=$('#fulfill').value==='delivery';$('#address').classList.toggle('hidden',!d);$('#address').querySelectorAll('input').forEach(i=>i.required=d);$('#fee').textContent=d?'Eligibility pending':'Free pickup';$('#fulfillment-note').textContent=d?'Provisional: free within 10 miles; free within 50 miles on $50+ orders, otherwise $10. Actual eligibility needs the dispatch address.':'Pickup location and appointment are confirmed before a live order.'}
function selectProduct(i,on){on?selected.add(i):selected.delete(i);$('#count').textContent=selected.size+' selected'}function filterRows(q){document.querySelectorAll('tr[data-name]').forEach(r=>r.hidden=!r.dataset.name.includes(q.toLowerCase()))}
function bulk(){if(!selected.size)return info('Select at least one product first.');openDialog('Update selected prices',`<p>${selected.size} products selected. Edit the base for each selected product.</p><div id="bases">${Array.from(selected).map(i=>`<label>${names[i]} · base per dozen<input type="number" min="0" step="0.01" data-base="${i}" value="${bases[i]}" oninput="previewPrice()"></label>`).join('')}</div><label>Markup type<select id="mode" onchange="previewPrice()"><option value="percent">Percentage</option><option value="fixed">Fixed dollar amount</option></select></label><label>Markup<input id="markup" type="number" value="0" min="0" step="0.01" oninput="previewPrice()"></label><div class="summary" id="price-preview"></div><p>Markup applies to each product’s base, not its previous selling price.</p><button class="dark" id="apply" onclick="applyPrice()">Apply to selected products</button>`);previewPrice()}
function previewPrice(){const v=Number($('#markup').value),valid=$('#markup').value!==''&&Number.isFinite(v)&&v>=0&&Array.from(document.querySelectorAll('[data-base]')).every(i=>i.value!==''&&Number.isFinite(Number(i.value))&&Number(i.value)>=0);$('#apply').disabled=!valid;$('#price-preview').textContent=valid?Array.from(selected).map(i=>names[i]+': $'+prices[i].toFixed(2)+' → $'+(Number(Array.from(document.querySelectorAll('[data-base]')).find(el=>Number(el.dataset.base)===i).value)*(1+($('#mode').value==='percent'?v/100:0))+($('#mode').value==='fixed'?v:0)).toFixed(2)).join(' · '):'Enter a valid nonnegative markup.'}
function applyPrice(){let v=Number($('#markup').value);selected.forEach(i=>{bases[i]=Number(Array.from(document.querySelectorAll('[data-base]')).find(el=>Number(el.dataset.base)===i).value);prices[i]=Math.round((Number(Array.from(document.querySelectorAll('[data-base]')).find(el=>Number(el.dataset.base)===i).value)*(1+($('#mode').value==='percent'?v/100:0))+($('#mode').value==='fixed'?v:0))*100)/100});$('#modal').close();render();$('#saved').textContent='Sample prices updated. No live products changed.'}
const platforms=[['instagram','Instagram','instagram.com'],['facebook','Facebook','facebook.com'],['tiktok','TikTok','tiktok.com'],['youtube','YouTube','youtube.com'],['pinterest','Pinterest','pinterest.com'],['x-twitter','X','x.com'],['threads','Threads','threads.com'],['linkedin','LinkedIn','linkedin.com'],['snapchat','Snapchat','snapchat.com'],['bluesky','Bluesky','bsky.app'],['whatsapp','WhatsApp','wa.me'],['telegram','Telegram','t.me'],['reddit','Reddit','reddit.com'],['discord','Discord','discord.com']];
let socialProfiles=[];
const escapeHTML=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brandIcon=id=>`<img class="brandicon" src="social-icons/${id}.svg" alt="" width="22" height="22">`;
function socialLinks(profiles=socialProfiles){return `<div class="social-links">${profiles.filter(p=>p.visible&&p.url).sort((a,b)=>a.order-b.order).map(p=>`<a href="${escapeHTML(p.url)}" aria-label="${escapeHTML(platforms.find(x=>x[0]===p.platform)[1]+(p.handle?' · '+p.handle:''))}" title="${escapeHTML(platforms.find(x=>x[0]===p.platform)[1])}" target="_blank" rel="noopener noreferrer">${brandIcon(p.platform)}</a>`).join('')}</div>`}
function recipeEditor(){openDialog('Recipe → product',`<div class="notice">Workflow preview only. Do not enter a real private recipe here. Production recipes will be stored in protected admin-only records.</div><label>Recipe / ingredients<textarea rows="6" placeholder="Sample ingredient names, amounts, units and method…" style="width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px"></textarea></label><div class="two"><label>Cookies per batch<input type="number" min="1" placeholder="24"></label><label>Finished batch weight (g)<input type="number" min="1" placeholder="Finished weight"></label></div><label>Ingredient brands / supplier labels<textarea rows="3" style="width:100%" placeholder="Needed for compound ingredients, allergens and nutrient matching"></textarea></label><label>Kitchen cross-contact notes<input placeholder="Owner-confirmed information"></label><h3>Build the product draft</h3><p>Recipe → ingredient matching → nutrition estimate → review → publish selected product fields.</p><ul><li>Description and suggested imagery</li><li>Ingredients and allergen flags</li><li>Nutrition per serving, with sources and review status</li><li>Cost estimate when ingredient costs are supplied</li><li>Owner base price + chosen markup</li></ul><p>Your recipe quantities and method stay private. Customers see only the reviewed product information.</p><button class="dark" onclick="$('#recipe-status').textContent='Analysis is not connected in this preview. Production will flag missing quantities, nutrient sources and yield before generating reviewed drafts.'">PREVIEW DRAFT WORKFLOW</button><p id="recipe-status" role="status"></p>`)}
function socialEditor(){openDialog('Social profiles',`<p>Add your profiles, choose their order, and turn on the ones customers should see.</p><form id="socialform"><div id="socialrows"></div><div class="toolbar"><label>Platform<select id="new-platform">${platforms.map(([id,name])=>`<option value="${id}">${name}</option>`).join('')}</select></label><button type="button" onclick="addSocialRow()">Add profile</button></div><h3>Storefront preview</h3><div id="social-preview"></div><p id="socialerror" role="alert"></p><button class="dark">Save profiles</button></form>`);socialProfiles.forEach(p=>socialRow(p));if(!socialProfiles.length)$('#social-preview').textContent='No profiles are visible yet.';else $('#social-preview').innerHTML=socialLinks();$('#socialform').onsubmit=e=>{e.preventDefault();const draft=readSocialRows();if(!draft)return;socialProfiles=draft;$('#modal').close();render();$('#saved').textContent='Social profiles saved in this preview session. Visible icons now appear on the storefront.'}}
function socialRow(p){const def=platforms.find(x=>x[0]===p.platform);const row=document.createElement('section');row.className='social-row panel';row.dataset.platform=p.platform;row.innerHTML=`<div class="sectionhead"><h3>${brandIcon(p.platform)} ${def[1]}</h3><button type="button" aria-label="Remove ${def[1]}" onclick="this.closest('.social-row').remove();previewSocial()">Remove</button></div><label>Handle<input class="social-handle" value="${escapeHTML(p.handle||'')}" placeholder="@yourhandle" oninput="previewSocial()"></label><label>Profile URL<input class="social-url" type="url" value="${escapeHTML(p.url||'')}" placeholder="https://${def[2]}/yourprofile" oninput="previewSocial()"></label><label>Display order<input class="social-order" type="number" min="1" step="1" value="${p.order||1}" oninput="previewSocial()"></label><label><input class="social-visible" type="checkbox" ${p.visible?'checked':''} onchange="previewSocial()">Visible on storefront</label>`;$('#socialrows').append(row)}
function addSocialRow(){const id=$('#new-platform').value;if(Array.from(document.querySelectorAll('.social-row')).some(r=>r.dataset.platform===id)){$('#socialerror').textContent='That platform is already listed. Edit its existing profile.';return}socialRow({platform:id,order:document.querySelectorAll('.social-row').length+1,visible:false});$('#socialerror').textContent='';previewSocial()}
function readSocialRows(){let error='';const rows=Array.from(document.querySelectorAll('.social-row')).map(r=>{const platform=r.dataset.platform,handle=r.querySelector('.social-handle').value.trim(),raw=r.querySelector('.social-url').value.trim(),visible=r.querySelector('.social-visible').checked,order=Number(r.querySelector('.social-order').value);let url='';if(raw){try{const u=new URL(raw);if(u.protocol!=='https:'||u.username||u.password)throw Error();const host=platforms.find(x=>x[0]===platform)[2],extra={'x-twitter':['twitter.com'],threads:['threads.net'],youtube:['youtu.be'],discord:['discord.gg'],whatsapp:['whatsapp.com']};if(![host,...(extra[platform]||[])].some(h=>u.hostname===h||u.hostname.endsWith('.'+h)))throw Error();url=u.href}catch{error='Use a valid HTTPS URL for the selected platform, without embedded credentials.'}}if(visible&&!url)error='Visible profiles need a valid profile URL.';if(!Number.isInteger(order)||order<1)error='Display order must be a positive whole number.';return{platform,handle,url,visible,order}});$('#socialerror').textContent=error;return error?null:rows}
function previewSocial(){const draft=readSocialRows();$('#social-preview').innerHTML=draft?socialLinks(draft):'<p>Fix the highlighted settings to preview these links.</p>';}
document.addEventListener('keydown',e=>{if(e.target.matches('[role=tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const target=e.key==='Home'?'guest':e.key==='End'?'login':e.target.id==='guest-tab'?'login':'guest';checkoutTab(target);$('#'+target+'-tab').focus();}});
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));render();
</script></html>
